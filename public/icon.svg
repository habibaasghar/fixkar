<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FixKar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <!-- rounded-square background (safe as a maskable icon: mark sits inside the inner 80%) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- bold "F" monogram -->
  <rect x="176" y="128" width="66" height="256" rx="10" fill="#ffffff"/>
  <rect x="176" y="128" width="184" height="64" rx="10" fill="#ffffff"/>
  <rect x="176" y="232" width="132" height="60" rx="10" fill="#ffffff"/>
  <!-- amber slotted-screw accent (the "fix" cue) -->
  <circle cx="360" cy="360" r="42" fill="#f59e0b"/>
  <rect x="338" y="352" width="44" height="16" rx="8" fill="#ffffff"/>
</svg>
