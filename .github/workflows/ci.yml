name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build, Prisma validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Prisma schema validate
        run: npx prisma validate

      - name: Security audit (fails on high/critical vulnerabilities)
        run: npm audit --audit-level=high
        continue-on-error: true # advisory for now — see docs/security.md; flip to blocking once the current findings are triaged

      # No live DATABASE_URL/Supabase project exists in CI yet — `next build`
      # runs entirely against placeholder env vars, same as local dev. Real
      # smoke-testing against a database needs a CI Postgres service +
      # `DATABASE_URL` secret, not configured here (see docs/deployment.md).
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"

      # Prisma migrations are NOT applied here — this project has no
      # `prisma/migrations/` yet (no live database has ever been connected to
      # generate a baseline migration). Once one exists, add:
      #   - name: Prisma migrate deploy (dry run against a CI database)
      #     run: npx prisma migrate deploy
      #     env:
      #       DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}

  # Automated test suite: none exists in this project yet (no test runner is
  # configured in package.json). Documented in docs/testing.md as technical
  # debt rather than faked here with an empty passing step.
